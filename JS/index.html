<!doctype html>
<html lang="en" data-theme="loam">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ant Colony</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <main class="stage">
        <div id="stage" class="stage__field"></div>
        <p class="stage__hint" id="place-hint" hidden>Click the ground to drop <strong id="place-hint-food">sugar</strong> &middot; <kbd>Esc</kbd> to stop</p>
      </main>

      <aside class="panel" aria-label="Simulation controls">
        <div class="panel__scroll">
          <header class="panel__head">
            <h1 class="panel__title">Ant Colony</h1>
            <p class="panel__sub">A pheromone foraging simulation</p>
          </header>

          <section class="group" aria-labelledby="colony-title">
            <h2 class="group__title" id="colony-title">Colony</h2>
            <div class="census">
              <span class="census__count" id="ant-count">0</span>
              <span class="census__label">ants alive<span class="census__max">of 100 max</span></span>
            </div>
            <div class="meter" aria-hidden="true"><span class="meter__fill" id="ant-meter"></span></div>
            <div class="btn-row">
              <button class="btn btn--primary" id="add-1" type="button">+1 ant</button>
              <button class="btn" id="add-10" type="button">+10 ants</button>
            </div>
            <dl class="stats">
              <div title="Food brought back to the nest"><dt>Stored</dt><dd id="stat-stored">0</dd></div>
              <div title="Ants hatched in the nest"><dt>Born</dt><dd id="stat-born">0</dd></div>
              <div><dt>Poisoned</dt><dd id="stat-poisoned">0</dd></div>
              <div><dt>Eaten</dt><dd id="stat-eaten">0</dd></div>
            </dl>
          </section>

          <section class="group" aria-labelledby="food-title">
            <h2 class="group__title" id="food-title">Food</h2>
            <p class="group__note">Pick one, then click the ground.</p>
            <div class="tools" role="group" aria-label="Food to place">
              <button class="tool" type="button" data-tool="biscuit" aria-pressed="false">
                <svg class="tool__icon" viewBox="0 0 30 30" aria-hidden="true">
                  <g fill="#cea05e" stroke="#845c2e" stroke-width=".8">
                    <rect x="4" y="4" width="6" height="6" rx="1" transform="rotate(-8 7 7)"/><rect x="12" y="4" width="6" height="6" rx="1"/><rect x="20" y="4" width="6" height="6" rx="1" transform="rotate(10 23 7)"/>
                    <rect x="4" y="12" width="6" height="6" rx="1"/><rect x="12" y="12" width="6" height="6" rx="1" transform="rotate(6 15 15)"/><rect x="20" y="12" width="6" height="6" rx="1"/>
                    <rect x="4" y="20" width="6" height="6" rx="1" transform="rotate(12 7 23)"/><rect x="12" y="20" width="6" height="6" rx="1"/><rect x="20" y="20" width="6" height="6" rx="1" transform="rotate(-6 23 23)"/>
                  </g>
                </svg>
                <span class="tool__name">Biscuit</span>
                <span class="tool__meta"><kbd>1</kbd><span data-piles="biscuit">0 piles</span></span>
              </button>
              <button class="tool" type="button" data-tool="sugar" aria-pressed="false">
                <svg class="tool__icon" viewBox="0 0 30 30" aria-hidden="true">
                  <g fill="#faf8f0" stroke="#8f8878" stroke-width=".8">
                    <rect x="4" y="4" width="6" height="6" rx=".5"/><rect x="12" y="4" width="6" height="6" rx=".5" transform="rotate(8 15 7)"/><rect x="20" y="4" width="6" height="6" rx=".5"/>
                    <rect x="4" y="12" width="6" height="6" rx=".5" transform="rotate(-10 7 15)"/><rect x="12" y="12" width="6" height="6" rx=".5"/><rect x="20" y="12" width="6" height="6" rx=".5" transform="rotate(6 23 15)"/>
                    <rect x="4" y="20" width="6" height="6" rx=".5"/><rect x="12" y="20" width="6" height="6" rx=".5" transform="rotate(-6 15 23)"/><rect x="20" y="20" width="6" height="6" rx=".5"/>
                  </g>
                </svg>
                <span class="tool__name">Sugar</span>
                <span class="tool__meta"><kbd>2</kbd><span data-piles="sugar">0 piles</span></span>
              </button>
              <button class="tool tool--danger" type="button" data-tool="toxic" aria-pressed="false">
                <svg class="tool__icon" viewBox="0 0 30 30" aria-hidden="true">
                  <circle cx="15" cy="15" r="14" fill="#a4d62e" opacity=".16"/>
                  <g fill="#a4d62e" stroke="#3e6012" stroke-width=".8">
                    <rect x="4" y="4" width="6" height="6" rx="2"/><rect x="12" y="4" width="6" height="6" rx="2"/><rect x="20" y="4" width="6" height="6" rx="2"/>
                    <rect x="4" y="12" width="6" height="6" rx="2"/><rect x="12" y="12" width="6" height="6" rx="2"/><rect x="20" y="12" width="6" height="6" rx="2"/>
                    <rect x="4" y="20" width="6" height="6" rx="2"/><rect x="12" y="20" width="6" height="6" rx="2"/><rect x="20" y="20" width="6" height="6" rx="2"/>
                  </g>
                </svg>
                <span class="tool__name">Toxic</span>
                <span class="tool__meta"><kbd>3</kbd><span data-piles="toxic">0 piles</span></span>
              </button>
            </div>
          </section>

          <section class="group" aria-labelledby="predator-title">
            <h2 class="group__title" id="predator-title">Predator</h2>
            <label class="predator">
              <svg class="predator__icon" viewBox="0 0 40 40" aria-hidden="true">
                <path d="M17 17 11 13 8 9M23 17 29 13 32 9M16.5 20 10 21 7 24M23.5 20 30 21 33 24M17 23 12 28 10 33M23 23 28 28 30 33" stroke="#c09e6c" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                <path d="M20 16c5 0 8.5 4.5 8.5 10S24 37 20 38c-4-1-8.5-6-8.5-12s3.5-10 8.5-10z" fill="#9a784e" stroke="#34241a" stroke-width="1.2" stroke-dasharray="1 1.3"/>
                <ellipse cx="20" cy="14" rx="4" ry="3.6" fill="#8c6c46"/>
                <ellipse cx="20" cy="9.5" rx="3.2" ry="3" fill="#946e44"/>
                <path d="M18.6 7.5C15 5 15 2.5 17.5 1.2M21.4 7.5C25 5 25 2.5 22.5 1.2" stroke="#c6823c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
              </svg>
              <span class="predator__text">
                <span class="predator__name">Antlion</span>
                <span class="predator__status" id="predator-status">Asleep in its pit</span>
              </span>
              <input class="switch" type="checkbox" role="switch" id="predator-toggle" aria-label="Release the antlion" />
            </label>
          </section>

          <section class="group" aria-labelledby="trails-title">
            <h2 class="group__title" id="trails-title">Trails</h2>
            <ul class="legend">
              <li title="Laid by ants out searching; leads back to the nest"><span class="legend__swatch" data-trail="home"></span>Home</li>
              <li title="Laid by ants carrying biscuit; leads to biscuit"><span class="legend__swatch" data-trail="biscuit"></span>Biscuit</li>
              <li title="Laid by ants carrying sugar; ants prefer it over biscuit"><span class="legend__swatch" data-trail="sugar"></span>Sugar</li>
              <li title="Laid by poisoned ants; others steer clear"><span class="legend__swatch" data-trail="toxic"></span>Warning</li>
            </ul>
          </section>

          <footer class="panel__foot">
            <div class="palette" role="radiogroup" aria-label="Colour palette">
              <span class="palette__label" aria-hidden="true">Palette</span>
              <button class="swatch" type="button" role="radio" data-theme-option="loam" aria-checked="true" aria-label="Loam palette" title="Loam"></button>
              <button class="swatch" type="button" role="radio" data-theme-option="dune" aria-checked="false" aria-label="Dune palette" title="Dune"></button>
            </div>
            <button class="btn btn--ghost" id="reset" type="button">Reset</button>
          </footer>
        </div>
      </aside>
    </div>
    <!-- Loader pulls in p5 (local vendor copy first, then CDNs) and then the bundle -->
    <script src="./loader.js"></script>
  </body>
</html>
